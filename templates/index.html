<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>IoT Device Monitor</h1>
    </header>
    <main>
        <section class="device-card">
            <h2>Sensor 1</h2>
            <p>Status: <span id="sensor1-status">Online</span></p>
            <p>Temperature: <span id="sensor1-temp">25.0</span> &deg;C</p>
            <button onclick="updateSensorData('sensor1')">Refresh</button>
        </section>
        <section class="device-card">
            <h2>Actuator 1</h2>
            <p>Status: <span id="actuator1-status">Off</span></p>
            <button onclick="toggleActuator('actuator1')">Toggle</button>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 IoT Dashboard</p>
    </footer>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
